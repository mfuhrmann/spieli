version: 2
updates:
  # GitHub Actions — keeps workflow SHA pins up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Svelte app dependencies
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    ignore:
      # vite 8.1.x pulls rolldown 1.1.3, whose linux/arm64-musl binding breaks
      # the Docker app build on Apple Silicon (`vite-wasm-fallback` enum error).
      # Hold on 8.0.x until that's resolved upstream — see #696.
      - dependency-name: "vite"
        versions: ["8.1.x"]

      # intl-messageformat is a devDependency used by exactly one thing:
      # app/src/lib/i18n.test.js, which refuses to graduate a locale whose
      # strings the ICU parser cannot read. The parser that matters at runtime
      # is the one svelte-i18n brings, and svelte-i18n@4 pins
      # intl-messageformat ^10.5.3. Bumping the devDependency to 11 makes npm
      # nest a second copy (svelte-i18n keeps 10, the test gets 11), so the
      # guard would validate against a parser the app never runs — silently.
      # Unpin once svelte-i18n itself moves to 11; see #890.
      - dependency-name: "intl-messageformat"
        update-types: ["version-update:semver-major"]

  # Root package.json (Playwright / legacy tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
