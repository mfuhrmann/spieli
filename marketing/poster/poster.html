<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>spieli poster</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<style>
  @page { size: A5; margin: 0; }
  :root {
    --sky: #b9e3fb;      /* kept light: saves ink, no banding on inkjets */
    --grass: #67bf5c;
    --grass-dark: #3d8b3d;
    --grass-far: #9ad48e;
    --dirt: #a0673a;
    --ink: #10243a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 148mm; height: 210mm; overflow: hidden; background: #fff; }
  body {
    font-family: "Nunito", sans-serif; color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    padding: 6mm;  /* white margin: inkjets cannot print borderless */
  }

  /* scene with pixel frame */
  .scene {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: var(--sky);
    border: 1.2mm solid var(--ink);
    box-shadow: 1.2mm 1.2mm 0 var(--ink);
  }

  .deco { position: absolute; display: block; z-index: 1; }
  .deco.sun { z-index: 0; }
  .cloud { position: absolute; background: #fff; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; }
  .c1 { top: 13mm; left: 8mm; width: 20mm; height: 4mm; }
  .c1::before { left: 4mm; top: -3.5mm; width: 10mm; height: 3.5mm; }
  .c1::after { left: 7mm; top: -6.5mm; width: 5mm; height: 3mm; }
  .c2 { top: 18mm; right: 10mm; width: 24mm; height: 4.5mm; }
  .c2::before { left: 5mm; top: -4mm; width: 12mm; height: 4mm; }
  .c2::after { left: 8.5mm; top: -7mm; width: 5.5mm; height: 3mm; }

  .c3 { top: 66mm; left: 24mm; width: 15mm; height: 3mm; }
  .c3::before { left: 3mm; top: -2.5mm; width: 7.5mm; height: 2.5mm; }
  .c3::after { left: 5.5mm; top: -4.8mm; width: 3.5mm; height: 2.3mm; }

  .head { position: absolute; top: 24mm; left: 0; right: 0; text-align: center; }
  h1 {
    font-family: "Silkscreen", monospace; font-weight: 700;
    font-size: var(--h1-size, 30pt); line-height: 1.05;
    color: var(--ink); text-shadow: 0.9mm 0.9mm 0 #fff;
  }
  .sub { font-size: 13.5pt; font-weight: 800; margin-top: 3.5mm; line-height: 1.25; }

  /* meadow in two bands: back lighter (further away), front saturated */
  .ground { position: absolute; left: 0; right: 0; bottom: 0; }
  .ground.back  { top: 116mm; background: var(--grass-far); }
  .ground.front { top: 139.5mm; background: var(--grass); z-index: 2; }  /* overlaps the edge svg: no hairline seam */
  .ground.back::before {   /* tufted pixel edge of the back meadow */
    content: ""; position: absolute; left: 0; right: 0; top: -2.5mm; height: 2.5mm;
    background: repeating-linear-gradient(90deg, var(--grass-far) 0 5mm, transparent 5mm 7.5mm);
  }
  .fg { position: absolute; display: block; z-index: 3; image-rendering: pixelated; }
  .front-edge { position: absolute; display: block; z-index: 2; }
  .ground.front i { position: absolute; background: var(--grass-dark); opacity: 0.55; }
  .mini { position: absolute; image-rendering: pixelated; z-index: 1; }

  /* the pin stands in the meadow: its tip (89 % of the image height) just below the edge */
  .pin {
    position: absolute; left: 14mm;
    width: 46mm; top: calc(140mm + 6mm - 0.89 * 46mm * 576 / 479);
    image-rendering: pixelated;
    z-index: 3;
  }

  /* pixel speech bubble pointing at the pin */
  .bubble {
    position: absolute; left: 58mm; width: max-content; max-width: 72mm; top: 77mm;
    background: #fff; border: 0.9mm solid var(--ink);
    box-shadow: 0.9mm 0.9mm 0 var(--ink);
    padding: 3mm 3.5mm; z-index: 3;
  }
  .bubble::before, .bubble::after {   /* pixel tail down-left to the pin */
    content: ""; position: absolute; background: var(--ink);
  }
  .bubble::before { left: 4mm; bottom: -4.2mm; width: 4.4mm; height: 4.2mm; }
  .bubble::after  { left: 1.6mm; bottom: -6.8mm; width: 3mm; height: 2.8mm;
    box-shadow: -2.4mm 2.3mm 0 -0.3mm var(--ink); }   /* third, smaller step: reaches the pin */
  .bubble b {
    display: block; font-family: "Silkscreen", monospace; font-weight: 700;
    font-size: 15pt; line-height: 1;
  }
  .bubble p { font-size: 10.5pt; font-weight: 800; line-height: 1.4; }

  .cta { z-index: 3;
    position: absolute; left: 0; right: 0; bottom: 8mm;
    display: flex; flex-direction: row-reverse; align-items: center; justify-content: center; gap: 6mm;
    color: #fff; text-align: right;   /* QR on the right, away from the pin */
  }
  /* second, smaller bubble down-right of the pin: the call to contribute */
  .bubble.small {
    left: 58mm; top: 130mm; max-width: 40mm;   /* centred on the meadow edge */
    border-width: 0.7mm; box-shadow: 0.7mm 0.7mm 0 var(--ink); padding: 1.6mm 2.4mm;
  }
  .bubble.small p { font-size: 9pt; font-weight: 900; line-height: 1.3; }
  .bubble.small::before { left: -3mm; top: 2.4mm; bottom: auto; width: 2.4mm; height: 2.2mm; }   /* tail rises up-left, to the pin's head */
  .bubble.small::after  { left: -5mm; top: 0.8mm; bottom: auto; width: 2mm; height: 1.8mm; box-shadow: none; }
  .qr { background: #fff; padding: 2mm; border: 0.9mm solid var(--ink); }
  .qr img { width: 27mm; height: 27mm; display: block; }
  .url {
    font-family: "Silkscreen", monospace; font-weight: 700; font-size: 19pt; line-height: 1;
    text-shadow: 0.6mm 0.6mm 0 var(--ink);
  }
  .trust { font-size: 10pt; font-weight: 900; margin-top: 2.5mm; line-height: 1.45; }
  .fine { font-size: 5.5pt; margin-top: 1.5mm; opacity: 0.85; }
</style>
</head>

<script>
  // One template, three languages: poster.html?lang=en|sk (default de).
  // Lines are separated by "|"; strings are plain text, never HTML.
  const TEXT = {
    de: {
      headline: 'Spielplatz|gesucht?',
      sub: 'Finde den, der zu|deinem Kind passt.',
      bubble: 'Schaukel fürs Baby.|Kletterturm für die Großen.|Ein Eis für hinterher.',
      trust: 'kostenlos · ehrenamtlich|ohne Werbung · ohne Tracking',
      join: 'Fehlt was?|Trag es ein!',
      attribution: 'Daten: © OpenStreetMap-Mitwirkende (ODbL)',
      qrAlt: 'QR-Code zu spieli.eu',
    },
    en: {
      headline: 'Looking for|a playground?',
      headlineSize: '25pt',
      sub: 'Find the one that is|right for your child.',
      bubble: 'Swings for babies.|Climbing for big kids.|Ice cream afterwards.',
      trust: 'free · volunteer-run|no ads · no tracking',
      join: 'Something missing?|Add it!',
      attribution: 'Data: © OpenStreetMap contributors (ODbL)',
      qrAlt: 'QR code for spieli.eu',
    },
    sk: {
      headline: 'Hľadáte|ihrisko?',
      sub: 'Nájdite to pravé|pre vaše dieťa.',
      bubble: 'Hojdačka pre bábätko.|Preliezačka pre väčšie deti.|A potom zmrzlina.',
      trust: 'zadarmo · dobrovoľnícky|bez reklám · bez sledovania',
      join: 'Chýba niečo?|Doplňte to!',
      attribution: 'Údaje: © prispievatelia OpenStreetMap (ODbL)',
      qrAlt: 'QR kód na spieli.eu',
    },
  };
  const lang = new URLSearchParams(location.search).get('lang');
  const t = TEXT[lang] ?? TEXT.de;
  document.documentElement.lang = TEXT[lang] ? lang : 'de';
  if (t.headlineSize) document.documentElement.style.setProperty('--h1-size', t.headlineSize);
  // Silkscreen has no l/d/t with caron, and the fallback font draws Ľ like Ï.
  // In Slovak those carons are written as an apostrophe anyway, so spell them so.
  const CARON = { 'ľ': "l'", 'Ľ': "L'", 'ď': "d'", 'Ď': "D'", 'ť': "t'", 'Ť': "T'" };
  const pixelSafe = (el, text) => getComputedStyle(el).fontFamily.includes('Silkscreen')
    ? text.replace(/[ľĽďĎťŤ]/g, c => CARON[c]) : text;
  for (const el of document.querySelectorAll('[data-t]')) {
    el.replaceChildren(...pixelSafe(el, t[el.dataset.t]).split('|').flatMap((line, i) =>
      i ? [document.createElement('br'), line] : [line]));
  }
  for (const el of document.querySelectorAll('[data-t-alt]')) el.alt = t[el.dataset.tAlt];
</script>
