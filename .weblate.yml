# Weblate component configuration reference.
#
# This file is NOT automatically read by Weblate. Use it as a checklist
# when manually configuring the component on hosted.weblate.org (#356),
# and as a record of what the live component is actually set to.
# Field names and values map directly to the Weblate REST API schema:
# https://docs.weblate.org/en/latest/api.html#post--api-components-
#
# Live component: https://hosted.weblate.org/projects/spieli/ui-strings/
#
# NOTE: The design doc originally specified file_format: json-i18n — that
# identifier does not exist in Weblate. The correct format for nested JSON
# files is json-nested. ICU plural strings (e.g. equipment.deviceCount) are
# treated as opaque string values; translators write the full ICU expression
# for their language's plural forms, which Weblate's string checks validate.
#
# Weblate's checks catch broken ICU *syntax* but cannot catch a grammatically
# correct form placed in the wrong plural category — see #747, where nine
# Slovak strings had the genitive plural in `many`, which for cs/sk matches
# only fractional numbers. docs/contributing/translation-guide.md documents
# the per-language rule.

component:
  name: ui-strings
  slug: ui-strings
  file_format: json-nested
  filemask: locales/*.json
  template: locales/en.json
  source_language: en
  push_branch: weblate-translations
  push_on_commit: true
  # Must stay `merge`. Weblate's default is `rebase`, which replays Weblate's
  # own commits onto main on every pull. main allows only squash and rebase
  # merges (the protect_main ruleset), so those commits never become ancestors
  # of main, the replay repeats forever, and it eventually conflicts — this
  # broke the component on 2026-07-29 (#794). With `merge`, Weblate merges main
  # into its branch and a squashed upstream PR integrates cleanly.
  merge_style: merge
  # Verified against the live component on 2026-07-31 (#796). These three were
  # the only fields that had drifted — Weblate still carried its stock English
  # templates, which is why the squash body of #734 reads as twelve
  # "* Translated using Weblate (…)" bullets. PATCHed to the values below.
  commit_message: "chore(i18n): update translations from Weblate"
  add_message: "chore(i18n): add {{ language_name }} translation from Weblate"
  delete_message: "chore(i18n): remove {{ language_name }} translation from Weblate"
  new_lang: add

# File format parameters, set under Settings → Files on the component.
# These replaced the "Customize JSON output" add-on, which was removed in
# Weblate 5.13.
#
# Do not enable json_sort_keys: Weblate follows the en.json template order,
# and sorting would reshuffle every locale file into one unreviewable diff.
file_format_params:
  json_indent: 2
  json_indent_style: spaces

# Add-ons, verified against the live install on 2026-07-31 (#796). `scope` is
# load-bearing when rebuilding from this file: installing a project-scoped
# add-on on the component silently narrows what it covers.
#
# Read them back from the component's `addons` field (a list of
# /api/addons/<id>/ URLs) or from /api/addons/; the /addons/ sub-path on the
# component returns 405. Both need a token — unauthenticated, /api/addons/
# returns 200 with an empty result set rather than an error. `wlc` has no
# add-on subcommand, so changes stay a UI action.
addons:
  # Removes translation keys no longer present in en.json — without it locale
  # files accumulate stale keys, as es.json and fr.json each did with three
  # that predated their removal from the template. Installed project-wide, so
  # it covers glossary too and does not appear in the component's own `addons`
  # list.
  - id: weblate.cleanup.generic
    scope: project          # Project → Add-ons
  # Collapses a push into one commit instead of one per language. This is what
  # the old `squash_commits: true` under `component:` was reaching for — not a
  # component field at all (absent from the live 89-field schema), so it never
  # took effect and #734 pushed twelve commits, which main's squash-merge then
  # folded into one commit body.
  #
  # commit_message is deliberately left empty for now: with it empty and
  # append_trailers on, Weblate builds the squashed body from the pending
  # commits' own messages, so the body repeats commit_message once per
  # language. Setting it here collapses that to a single line.
  #
  # Squashing also makes the push a rewrite — Weblate resets onto the remote
  # branch after each commit and its GitHub backend pushes with --force — so
  # weblate-translations' history is replaced on every batch.
  - id: weblate.git.squash
    scope: component        # Operations → Add-ons
    configuration:
      squash: all
      append_trailers: true
      commit_message: ""

# NOT an add-on here, despite what the Weblate manual implies: Hosted Weblate
# serves the component repository at the `git_export` URL natively, and
# weblate.gitexport.gitexport appears nowhere in this install's add-on list.
# The recovery in docs/contributing/translations.md diffs against that URL, so
# it still has to resolve — just nothing to enable.
