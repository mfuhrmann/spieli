# No access log, anywhere in this container (#988).
#
# The stock /etc/nginx/nginx.conf logs every request with the visitor's IP,
# user agent and full URI to stdout, i.e. into the Docker logs - and an API
# URI carries the map extent someone is looking at. At http level "off"
# cancels every access_log of that level, whichever order the include lands
# in, so this holds without patching the base image's file. The per-location
# "access_log off" lines in the generated /ext/ and basemap config stay as
# defence in depth.
#
# error_log stays, so failures remain diagnosable. log_not_found off keeps
# plain 404s (scanners probing paths) out of it.
access_log off;
log_not_found off;
