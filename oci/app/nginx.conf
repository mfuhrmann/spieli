server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # HTTP security headers
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "geolocation=(self)"               always;
    # ── Content-Security-Policy — generated at container startup ────────────────
    # docker-entrypoint.sh always writes this file. It carries the enforced
    # policy plus a narrowed report-only one; the host lists cannot be a literal
    # here because hub backends come from an operator-supplied registry and a
    # basemap opt-out adds a third-party tile host.
    # 'unsafe-inline' in style-src is required by Bootstrap and OpenLayers; remove when a nonce-based approach is adopted.
    # frame-ancestors allows any HTTPS parent to embed this app (required for the Hub).
    include /etc/nginx/csp.conf;

    # ── config.js — written at container startup from env vars ──────────────────
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ── /api/ → PostgREST (standalone mode only) ─────────────────────────────────
    # In hub mode this block is still present but the frontend does not call /api/
    # directly — it uses per-backend URLs fetched from the registry instead.
    location /api/ {
        set $postgrest_upstream http://postgrest:3000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $postgrest_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow cross-origin requests so the Hub can query standalone instances.
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin  "*"             always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS"  always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Accept, Content-Type";
            return 204;
        }

        proxy_connect_timeout  5s;
        proxy_read_timeout    60s;
    }

    # ── /basemap/ → bundled style assets: disk first, cached upstream second ────
    # Always present. The bundled vector style references every asset under
    # /basemap/, so the visitor's browser only ever talks to this origin, and
    # the cache spares the public tile server the federation's full load.
    include /etc/nginx/basemap-location.conf;

    # ── /tiles/ → basemap proxy (only when BASEMAP_PROXY is enabled) ────────────
    # docker-entrypoint.sh always writes this file: the /tiles/ location when
    # proxying is configured, a comment otherwise. It lives outside conf.d
    # because that directory is auto-included at http level, and a location
    # block belongs to the server. The matching proxy_cache_path is written to
    # conf.d, where http-level directives belong.
    include /etc/nginx/tiles-location.conf;

    # ── /ext/ → cached external-service proxies ─────────────────────────────────
    # Nominatim, Commons and Mangrove, fetched server-side so the visitor's
    # browser does not contact them. Panoramax is deliberately absent: its
    # thumbnail endpoint redirects to a per-instance derivative host that nginx
    # cannot follow. Always written by
    # docker-entrypoint.sh (empty when every proxy is disabled). The matching
    # proxy_cache_path and limit_req_zone go to conf.d, where http-level
    # directives belong.
    include /etc/nginx/ext-locations.conf;

    # ── /api2/ → second PostgREST (Hub dev testing) ─────────────────────────────
    location /api2/ {
        set $postgrest2_upstream http://postgrest2:3000;
        rewrite ^/api2/(.*) /$1 break;
        proxy_pass $postgrest2_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin  "*"             always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS"  always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Accept, Content-Type";
            return 204;
        }

        proxy_connect_timeout  5s;
        proxy_read_timeout    60s;
    }

    # ── version.json — no caching, cross-origin for Hub ─────────────────────────
    location = /version.json {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ── federation-status.json — hub health rollup, no caching, CORS ────────────
    location = /federation-status.json {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ── /metrics — Prometheus text exposition format ──────────────────────────────
    location = /metrics {
        default_type "text/plain; version=0.0.4; charset=utf-8";
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ── Legal pages — generated at container startup from env vars ───────────────
    location = /legal/impressum {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-store";
        try_files /impressum.html =404;
    }

    location = /legal/datenschutz {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-store";
        try_files /datenschutz.html =404;
    }

    # Backwards-compatible redirects from old legal page paths
    rewrite ^/(impressum|datenschutz)$ /legal/$1 permanent;

    # ── Vite-hashed static assets — long-term immutable caching ─────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
